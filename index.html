<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-Z 타이핑 챌린지</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #1e1e2f;
      font-family: 'Segoe UI', sans-serif;
      color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 2rem;
      padding: 2rem;
      flex-wrap: wrap;
    }
    .container {
      background-color: #2b2b40;
      padding: 2rem;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
    }
    .records {
      background-color: #2b2b40;
      padding: 1.5rem;
      border-radius: 16px;
      width: 240px;
      height: fit-content;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
    }
    h1 { font-size: 1.8rem; margin-bottom: 1rem; }
    p { font-size: 1rem; color: #aaa; margin-bottom: 1.5rem; }
    .timer {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #00ffa0;
    }
    input.input-box {
      font-size: 1.5rem;
      padding: 0.75rem;
      width: 100%;
      border: 2px solid #444;
      border-radius: 8px;
      background-color: #1e1e2f;
      color: #fff;
      outline: none;
      letter-spacing: 0.15rem;
      text-align: center;
    }
    input.input-box:focus {
      border-color: #00ffa0;
    }
    .result {
      margin-top: 2rem;
    }
    .result h2 { color: #00ffa0; }
    .btn {
      background-color: #00ffa0;
      color: #1e1e2f;
      border: none;
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1rem;
    }
    .btn:hover {
      background-color: #00e694;
    }
    .record-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .record-list li {
      background: #1e1e2f;
      margin-bottom: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      color: #ccc;
    }
    .record-list li.best {
      border: 2px solid #00ffa0;
      color: #00ffa0;
      font-weight: bold;
    }
    .records h3 {
      margin-bottom: 1rem;
      font-size: 1.2rem;
      color: #f0f0f0;
    }
  </style>
</head>
<body>

  <!-- 챌린지 UI -->
  <div class="container">
    <h1>🚀 A to Z 타이핑 챌린지</h1>
    <p>최대한 빠르게 a부터 z까지 입력해보세요!</p>

    <div class="timer" id="timer">0.00s</div>
    
    <input 
      type="text" 
      id="typingInput" 
      class="input-box" 
      maxlength="26" 
      autofocus 
      placeholder="여기에 입력 시작"
    />

    <div id="result" class="result" style="display: none;">
      <h2>🎉 완료!</h2>
      <p>걸린 시간: <span id="finalTime"></span>초</p>
      <button class="btn" onclick="restart()">다시 도전</button>
    </div>
  </div>

  <!-- 기록 보기 패널 -->
  <div class="records">
    <h3>📜 내 기록</h3>
    <ul id="recordList" class="record-list"></ul>
  </div>

  <script>
    const correct = "abcdefghijklmnopqrstuvwxyz";
    let startTime = null;
    let timerInterval = null;
    const input = document.getElementById("typingInput");
    const timerDisplay = document.getElementById("timer");
    const result = document.getElementById("result");
    const finalTime = document.getElementById("finalTime");
    const recordList = document.getElementById("recordList");

    // 🔒 붙여넣기 방지
    input.addEventListener("paste", (e) => e.preventDefault());
    input.addEventListener("contextmenu", (e) => e.preventDefault());
    input.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "v") e.preventDefault();
    });

    // 입력 감지
    input.addEventListener("input", () => {
      const typed = input.value.toLowerCase();

      if (typed.length === 0) resetTimerDisplay();
      if (typed === "a" && !startTime) {
        startTime = performance.now();
        timerInterval = setInterval(updateTimerDisplay, 10);
      }

      if (!correct.startsWith(typed)) {
        input.style.borderColor = "red";
      } else {
        input.style.borderColor = "#00ffa0";
      }

      if (typed === correct) {
        const endTime = performance.now();
        const duration = ((endTime - startTime) / 1000).toFixed(2);
        clearInterval(timerInterval);
        timerDisplay.textContent = duration + "s";
        finalTime.textContent = duration;
        result.style.display = "block";
        input.disabled = true;

        saveRecord(duration);
      }
    });

    function updateTimerDisplay() {
      if (startTime) {
        const now = performance.now();
        const elapsed = ((now - startTime) / 1000).toFixed(2);
        timerDisplay.textContent = elapsed + "s";
      }
    }

    function resetTimerDisplay() {
      timerDisplay.textContent = "0.00s";
      clearInterval(timerInterval);
      startTime = null;
    }

    function restart() {
      input.value = "";
      input.disabled = false;
      input.focus();
      resetTimerDisplay();
      result.style.display = "none";
      input.style.borderColor = "#444";
    }

    // 기록 저장
    function saveRecord(time) {
      const records = JSON.parse(localStorage.getItem("records") || "[]");
      records.push(parseFloat(time));
      localStorage.setItem("records", JSON.stringify(records));
      renderRecords();
    }

    // 기록 UI 업데이트
    function renderRecords() {
      const records = JSON.parse(localStorage.getItem("records") || "[]");
      recordList.innerHTML = "";

      if (records.length === 0) return;

      const best = Math.min(...records);

      records
        .slice()
        .sort((a, b) => a - b)
        .forEach((r) => {
          const li = document.createElement("li");
          li.textContent = `${r.toFixed(2)}s`;
          if (r === best) li.classList.add("best");
          recordList.appendChild(li);
        });
    }

    renderRecords(); // 최초 실행 시 기록 로딩
  </script>
</body>
</html>
